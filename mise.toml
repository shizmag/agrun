[tools]
ruby = "4.0.9"

[env]
GEM_HOME = "{{config_root}}/.bundle/gems"
GEM_PATH = "{{config_root}}/.bundle/gems"
BUNDLE_PATH = "{{config_root}}/.bundle/gems"

[tasks.test]
description = "Run all Minitest tests offline"
run = "bundle exec ruby -Itest -e 'Dir[\"test/**/*_test.rb\"].sort.each { |file| require_relative file }'"

[tasks.m12b-acceptance]
description = "Run pinned mock CLI execution with actual local audited grading; no provider calls"
run = "bundle exec ruby script/m12b_mock_acceptance.rb"

[tasks.lint]
description = "Check Ruby formatting"
run = "bundle exec standardrb"

[tasks.smoke]
description = "Compile and execute the local demo"
run = ["bundle exec ruby bin/agru doctor", "bundle exec ruby bin/agru validate", "bundle exec ruby bin/agru run --offline"]

[tasks.benchmark-demo]
description = "Run the deterministic offline benchmark"
run = "bundle exec ruby bin/agru benchmark --suite demo --solver all --repetitions 2 --offline"

[tasks.conformance]
description = "Run deterministic M0.1 harness conformance (no live models)"
run = "bundle exec ruby -Itest script/m01_conformance.rb"

[tasks.acceptance]
description = "Run all seven persisted M0.1 acceptance scenarios offline"
run = "bundle exec ruby -Itest test/m01_acceptance_test.rb"

[tasks.bench-doctor]
description = "Inspect benchmark readiness without downloads or model calls"
run = "bundle exec ruby bin/agru bench doctor"

[tasks.bench-test]
description = "Run deterministic benchmark infrastructure tests without Docker"
run = "bundle exec ruby -Itest -e 'Dir[\"test/benchmark/**/*_test.rb\", \"test/benchmark_cli_test.rb\", \"test/benchmark_isolation_test.rb\", \"test/experiment_runner_test.rb\", \"test/m11_adversarial_test.rb\"].sort.each { |file| require_relative file }'"

[tasks.bench-contract]
description = "Run benchmark adapter and experiment contract tests offline"
run = "bundle exec ruby -Itest -e 'Dir[\"test/benchmark/registry_test.rb\", \"test/benchmark/experiment_manifest_test.rb\", \"test/benchmark/fixture_adapter_test.rb\"].sort.each { |file| require_relative file }'"

[tasks.bench-official-verify]
description = "Explicit native protocol validation gate (nonzero while blocked)"
run = "bundle exec ruby bin/agru bench verify nl2repo --offline"

[tasks.bench-smoke]
description = "Persist a four-solver deterministic infrastructure experiment"
run = "bundle exec ruby bin/agru bench run experiments/fixture-infrastructure-smoke.json --offline"

[tasks.bench-acceptance]
description = "Persist fresh offline matrix, regrade and three-format acceptance evidence"
run = "bundle exec ruby script/m11_acceptance.rb"

[tasks.verify]
description = "All offline regressions, acceptance, conformance, lint and specification checks"
run = ["mise run test", "mise run lint", "mise run smoke", "mise run acceptance", "mise run conformance", "openspec validate m11-benchmark-infrastructure --strict"]
[tasks.m12-acceptance]
description = "Run persisted M1.2a offline execution fixture acceptance (no providers)"
run = "bundle exec ruby script/m12_execution_acceptance.rb"

[tasks.m12-test]
description = "Run M1.2a offline execution, usage, budget and lifecycle contracts"
run = "bundle exec ruby -Itest -e 'Dir[\"test/execution/**/*_test.rb\", \"test/m12*_test.rb\"].sort.each { |file| require_relative file }'"

[tasks.m12-mutations]
description = "Run isolated offline execution mutations (no provider calls)"
run = "bundle exec ruby script/m12_mutations.rb"

[tasks.m12-audited-acceptance]
description = "Explicit local pinned audited grading of an offline fake OpenCode solver"
run = "bundle exec ruby script/m12_audited_acceptance.rb --allow-local-grading"
[tasks.m12b-test]
description = "Offline M1.2b authorization, lifecycle and reporting acceptance"
run = "bundle exec ruby -Itest -e 'Dir[\"test/m12b*_test.rb\", \"test/opencode_launch_test.rb\"].sort.each { |file| require_relative file }'"

[tasks.m12b-mutation]
description = "Isolated offline M1.2b adversarial mutations"
run = "bundle exec ruby script/m12b_mutation_check.rb"
